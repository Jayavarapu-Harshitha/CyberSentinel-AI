[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cybersentinel-ai"
version = "0.1.0"
description = "Reproducible CIC-IDS2017 intrusion detection and model aggregation"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "joblib>=1.3", "PyYAML>=6"]
[project.optional-dependencies]
app = ["streamlit>=1.35", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
trees = ["xgboost>=2.0", "lightgbm>=4.0"]
test = ["pytest>=8"]
[tool.setuptools.packages.find]
where = ["src"]
